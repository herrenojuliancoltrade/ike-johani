# Blueprint de Render: https://render.com/docs/blueprint-spec
# Render > New > Blueprint > seleccionar este repositorio.
# Las variables con `sync: false` se piden en el panel al crear el Blueprint.

databases:
  - name: ike-db
    plan: free
    region: virginia
    databaseName: ike_asistencias
    user: ike
    # Solo accesible desde servicios de Render (red interna).
    # Para conectarse desde tu PC agrega tu IP: - source: x.x.x.x/32
    ipAllowList: []

services:
  # ---------------------------------------------------------------- Backend
  - type: web
    name: ike-backend
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ike-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: TIME_ZONE
        value: America/Bogota
      - key: WEB_CONCURRENCY
        value: "2"
      # URL del frontend, ej: https://ike-frontend.onrender.com (sin / final)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Pon True en el primer despliegue si quieres los datos demo
      - key: LOAD_DEMO_DATA
        value: "False"
      # Superusuario inicial (opcional; se crea solo si no existe)
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # --------------------------------------------------------------- Frontend
  - type: web
    name: ike-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # SPA (React Router): todas las rutas sirven index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: "22"
      # URL del backend terminada en /api, ej: https://ike-backend.onrender.com/api
      - key: VITE_API_URL
        sync: false
      - key: VITE_POLLING_MS
        value: "10000"
